services:
  db:
    image: postgres:16-alpine
    container_name: banco-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
      POSTGRES_DB: banco
    ports:
      - '5432:5432'
    volumes:
      - banco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banco -d banco']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: banco-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://banco:banco@db:5432/banco?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  banco_pgdata:
